[package]
name = "forex-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "forex_tauri_lib"
crate-type = ["rlib"]

[[bin]]
name = "forex-tauri"
path = "src/main.rs"

[features]
default = ["sqlite"]
sqlite = ["forex-db/sqlite"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
forex-core = { workspace = true }
forex-db = { workspace = true }
forex-api = { workspace = true }
forex-ingestor = { workspace = true }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
rspc = { version = "0.4", features = ["legacy", "typescript"] }
tauri-plugin-rspc = "0.2"
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
