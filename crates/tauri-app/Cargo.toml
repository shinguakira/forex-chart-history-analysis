[package]
name = "forex-tauri"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "forex_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "forex-tauri"
path = "src/main.rs"

[features]
default = ["sqlite"]
# Pick one or both. With both, the runtime DATABASE_URL scheme decides
# (sea-orm dispatches on `sqlite://` vs `postgres://`). With sqlite only,
# the desktop app falls back to a per-user AppData file; with postgres
# only, DATABASE_URL is required at launch.
sqlite = ["forex-db/sqlite"]
postgres = ["forex-db/postgres"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
forex-core = { workspace = true }
forex-db = { workspace = true }
forex-api = { workspace = true }
forex-ingestor = { workspace = true }
tauri = { version = "2", features = [] }
rspc = { version = "0.4", features = ["legacy", "typescript"] }
tauri-plugin-rspc = "0.2"
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
dotenvy = "0.15"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
