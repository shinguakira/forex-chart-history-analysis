[package]
name = "forex-api"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
forex-core = { workspace = true }
forex-db = { workspace = true }
rspc = { version = "0.4", features = ["legacy", "typescript"] }
rspc-legacy = "0.0.1"
futures-util = "0.3"
specta = { version = "=2.0.0-rc.22", features = ["derive", "uuid", "chrono", "serde"] }
specta-typescript = "0.0.9"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
async-trait = "0.1"
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
sea-orm = { version = "1", default-features = false, features = ["macros", "runtime-tokio-rustls", "with-chrono", "with-uuid", "with-json"] }
