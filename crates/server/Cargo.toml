[package]
name = "forex-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

default-run = "forex-server"

[[bin]]
name = "forex-server"
path = "src/main.rs"

[[bin]]
name = "export-bindings"
path = "src/bin/export_bindings.rs"

[features]
default = ["postgres"]
postgres = ["forex-db/postgres"]
sqlite = ["forex-db/sqlite"]

[dependencies]
forex-core = { workspace = true }
forex-db = { workspace = true }
forex-api = { workspace = true }
forex-ingestor = { workspace = true }
rspc = { version = "0.4", features = ["legacy", "typescript"] }
rspc-axum = { version = "0.3", features = ["ws"] }
axum = { version = "0.7", features = ["ws"] }
tower-http = { version = "0.5", features = ["cors", "fs", "trace"] }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
dotenvy = "0.15"
anyhow = { workspace = true }
