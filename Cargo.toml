[workspace]
resolver = "2"
members = [
  "crates/core",
  "crates/db",
  "crates/ai",
  "crates/ingestor",
  "crates/api",
  "crates/server",
  "crates/tauri-app",
  "crates/migrate-from-json",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "MIT"
publish = false

[workspace.dependencies]
forex-core = { path = "crates/core" }
forex-db = { path = "crates/db" }
forex-ai = { path = "crates/ai" }
forex-ingestor = { path = "crates/ingestor" }
forex-api = { path = "crates/api" }
forex-server = { path = "crates/server" }
forex-tauri = { path = "crates/tauri-app" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }

[profile.dev]
opt-level = 0

[profile.release]
opt-level = 3
lto = "thin"
strip = "symbols"
